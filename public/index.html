<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwollenHippo Coffee Time Clock</title>
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="bg-dark text-light">
    <main class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 m-0">SwollenHippo Coffee Time Clock</h1>
        <button id="btnLogout" type="button" class="btn btn-outline-light btn-sm d-none">Logout</button>
      </div>

      <div id="divAlert"></div>

      <section id="secLogin" class="card bg-black border-secondary">
        <div class="card-body">
          <h2 class="h5">Employee Login</h2>
          <form id="frmLogin" class="row g-3">
            <div class="col-12">
              <label for="txtPin" class="form-label">PIN</label>
              <input aria-label="PIN" id="txtPin" type="password" inputmode="numeric" maxlength="8" class="form-control" required />
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-warning w-100">Sign In</button>
            </div>
          </form>
        </div>
      </section>

      <section id="secDashboard" class="d-none">
        <div class="row g-3 mt-1">
          <div class="col-md-4">
            <div class="card bg-black border-secondary h-100">
              <div class="card-body">
                <h2 class="h5">Shift Status</h2>
                <p class="mb-2">Name: <span id="spnName">-</span></p>
                <p class="mb-3">Status: <span id="spnStatus" class="badge text-bg-secondary">Unknown</span></p>
                <button id="btnToggle" type="button" class="btn btn-warning w-100">Clock In</button>
              </div>
            </div>
          </div>

          <div class="col-md-8">
            <div class="card bg-black border-secondary h-100">
              <div class="card-body">
                <h2 class="h5">Recent Entries</h2>
                <div class="table-responsive">
                  <table class="table table-dark table-striped align-middle">
                    <thead>
                      <tr>
                        <th>Clock In (UTC)</th>
                        <th>Clock Out (UTC)</th>
                        <th>Hours</th>
                      </tr>
                    </thead>
                    <tbody id="tbMyEntries"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div id="secAdmin" class="card bg-black border-secondary mt-3 d-none">
          <div class="card-body">
            <h2 class="h5">Admin</h2>
            <form id="frmCreateEmployee" class="row g-2 mb-3">
              <div class="col-md-3">
                <input aria-label="Employee name" name="name" class="form-control" placeholder="Name" required />
              </div>
              <div class="col-md-3">
                <input aria-label="Employee email" name="email" type="email" class="form-control" placeholder="Email" required />
              </div>
              <div class="col-md-2">
                <input aria-label="Employee pin" name="pin" class="form-control" inputmode="numeric" placeholder="PIN" required />
              </div>
              <div class="col-md-2">
                <select aria-label="Employee role" name="role" class="form-select">
                  <option value="employee">employee</option>
                  <option value="admin">admin</option>
                </select>
              </div>
              <div class="col-md-2">
                <button type="submit" class="btn btn-outline-light w-100">Create</button>
              </div>
            </form>

            <h3 class="h6">Employees</h3>
            <div class="table-responsive mb-3">
              <table class="table table-dark table-striped">
                <thead>
                  <tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Active</th></tr>
                </thead>
                <tbody id="tbEmployees"></tbody>
              </table>
            </div>

            <h3 class="h6">All Time Entries</h3>
            <div class="table-responsive">
              <table class="table table-dark table-striped">
                <thead>
                  <tr><th>Employee</th><th>Clock In</th><th>Clock Out</th></tr>
                </thead>
                <tbody id="tbAllEntries"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
